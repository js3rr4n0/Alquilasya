# Análisis de seguridad del código (CodeQL): busca inyecciones, XSS, secretos
# expuestos y otros errores comunes. Corre en cada pull request a main y una vez
# por semana. Los hallazgos aparecen en GitHub → Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  analizar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
